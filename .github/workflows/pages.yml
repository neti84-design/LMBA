# 넛츠 앱(nuts-app/)을 GitHub Pages 로 배포합니다.
# 저장소 Settings → Pages → Source 가 "GitHub Actions" 여야 합니다 (configure-pages 가 처음 한 번 자동으로 켭니다).
name: Deploy NUTS app

on:
  push:
    branches: [main, claude/confident-ride-gqw2hh]
    paths: ["nuts-app/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: nuts-app
      - id: deployment
        uses: actions/deploy-pages@v4
