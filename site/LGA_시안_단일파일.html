/b><span>롯데 전점에서 매년 열리는 팝업 — 측정 없이 끝나던 실험<\/span><\/div>\n    <div class=\"stat\"><b>3<small>사 데이터<\/small><\/b><span>공간·트래픽(백화점) + 소비 이력(멤버스) + 비전 AI(이노베이트)<\/span><\/div>\n    <div class=\"stat\"><b>+3.3<small>%p<\/small><\/b><span>처방 적용 후 집품→구매 전환 개선 (파일럿 예시)<\/span><\/div>\n  <\/div>\n<\/div>\n\n<section class=\"spots\" id=\"spots\">\n  <div class=\"wrap\">\n    <span class=\"eyebrow\">Free Preview<\/span>\n    <h2 class=\"h2\">유입률 좋은 자리는,<br>계약 전에 먼저 보여드립니다.<\/h2>\n    <p class=\"lead\">브랜드가 우리에게 가장 먼저 묻는 질문은 \"어디에 열어야 하나\"입니다. 이번 달 롯데 전점에서 유입률이 가장 높았던 스팟 세 곳과 그 평균 유입률을 그대로 공개합니다. 로그인도, 문의도 필요 없습니다.<\/p>\n    <div class=\"cards\">\n      <article class=\"spot\">\n        <div class=\"head\"><span class=\"rank\">TOP 1<\/span><span class=\"cat\">뷰티 · 팝업존<\/span><\/div>\n        <h3>본점 2F · 에스컬레이터 정면<\/h3>\n        <div class=\"rate\"><b>9.4<\/b><span>%<\/span><small>평균 유입률<\/small><\/div>\n        <p class=\"vs\">카테고리 평균 5.2% 대비 <b>1.8배<\/b><\/p>\n        <ul class=\"meta\">\n          <li>일 평균 통행 <b>12,400명<\/b><\/li>\n          <li>유입 피크 <b>주중 14~17시<\/b><\/li>\n        <\/ul>\n        <div class=\"lock\"><span>구매 전환율<\/span><b>■ ■ %<\/b><\/div>\n      <\/article>\n      <article class=\"spot\">\n        <div class=\"head\"><span class=\"rank\">TOP 2<\/span><span class=\"cat\">패션 · 팝업존<\/span><\/div>\n        <h3>잠실 에비뉴엘 1F · 정문 리드존<\/h3>\n        <div class=\"rate\"><b>8.6<\/b><span>%<\/span><small>평균 유입률<\/small><\/div>\n        <p class=\"vs\">카테고리 평균 5.2% 대비 <b>1.7배<\/b><\/p>\n        <ul class=\"meta\">\n          <li>일 평균 통행 <b>18,900명<\/b><\/li>\n          <li>유입 피크 <b>주말 12~15시<\/b><\/li>\n        <\/ul>\n        <div class=\"lock\"><span>구매 전환율<\/span><b>■ ■ %<\/b><\/div>\n      <\/article>\n      <article class=\"spot\">\n        <div class=\"head\"><span class=\"rank\">TOP 3<\/span><span class=\"cat\">라이프스타일 · 팝업존<\/span><\/div>\n        <h3>인천점 3F · 식음 동선 접점<\/h3>\n        <div class=\"rate\"><b>7.9<\/b><span>%<\/span><small>평균 유입률<\/small><\/div>\n        <p class=\"vs\">카테고리 평균 5.2% 대비 <b>1.5배<\/b><\/p>\n        <ul class=\"meta\">\n          <li>일 평균 통행 <b>7,600명<\/b><\/li>\n          <li>유입 피크 <b>주중 저녁 18~20시<\/b><\/li>\n        <\/ul>\n        <div class=\"lock\"><span>구매 전환율<\/span><b>■ ■ %<\/b><\/div>\n      <\/article>\n    <\/div>\n\n    <div class=\"gate\">\n      <div class=\"open\">\n        <h4>여기까지는 무료<\/h4>\n        <ul>\n          <li>유입률 상위 스팟 세 곳과 각각의 <b>평균 유입률<\/b><\/li>\n          <li>스팟별 <b>일 평균 통행량 · 시간대 · 요일 패턴<\/b><\/li>\n          <li>카테고리 평균 대비 <b>몇 배<\/b>인지<\/li>\n        <\/ul>\n        <p>유입률과 통행량은 <b>공간의 지표<\/b>입니다. 그 자리를 운영하는 롯데의 데이터이므로 저희가 열 수 있습니다.<\/p>\n      <\/div>\n      <div class=\"shut\">\n        <h4>L.GA를 운영하면 열립니다<\/h4>\n        <ul>\n          <li>그 스팟의 <b>구매 전환율과 객단가<\/b><\/li>\n          <li>내 매장에 온 사람 중 <b>신규 비율<\/b><\/li>\n          <li>들어왔는데 안 산 사람의 <b>소비 프로파일<\/b><\/li>\n          <li><b>집품률 · 체류시간 · 이탈 지점<\/b><\/li>\n          <li>다음 팝업 <b>자리 · 시기 처방<\/b><\/li>\n        <\/ul>\n        <p>전환율과 객단가는 그 자리에 있던 <b>브랜드의 성과<\/b>입니다. 팝업 솔루션 패키지 · 월 구독 · 해당 매장에서 L.GA를 운영할 때만 열립니다.<\/p>\n        <div class=\"actions\">\n          <a class=\"btn primary\" href=\"#contact\">도입 문의하기 <span class=\"arrow\">→<\/span><\/a>\n          <a class=\"btn ghost\" href=\"#pricing\">요금 보기<\/a>\n        <\/div>\n      <\/div>\n    <\/div>\n\n    <p class=\"fine\">※ 이 페이지의 스팟명과 수치는 예시입니다. 실제 공개 값은 해당 월 실측 데이터로 산출하며, 브랜드 한 곳이 특정되는 전용 구역은 제외하고 복수 브랜드 운영 이력이 있는 구역만 집계합니다.<\/p>\n  <\/div>\n<\/section>\n\n<section class=\"pain\" id=\"problem\">\n  <div class=\"wrap\">\n    <span class=\"eyebrow\">Problem<\/span>\n    <h2 class=\"h2\">팝업이 끝나면 손에 남는 건 매출 총액과 해시태그 개수뿐입니다.<\/h2>\n    <div class=\"grid\">\n      <div class=\"card\"><span class=\"n\">PAIN 01<\/span><h3>온 사람이 신규인지, 원래 우리 고객인지 모른다<\/h3><p>브랜드 데이터는 자사 POS에서 끝납니다. \"산 사람이 산 것\"만 남고, 이번 팝업이 신규 획득을 했는지는 영원히 알 수 없습니다.<\/p><\/div>\n      <div class=\"card\"><span class=\"n\">PAIN 02<\/span><h3>들어왔는데 안 산 사람이 누구였는지 모른다<\/h3><p>가격 미스매치인지, 타깃을 잘못 잡았는지. 집었다가 내려놓은 상품이 무엇인지. 온라인의 '장바구니 이탈'에 해당하는 데이터가 오프라인엔 없습니다.<\/p><\/div>\n      <div class=\"card\"><span class=\"n\">PAIN 03<\/span><h3>그래서 다음 팝업도 감으로 연다<\/h3><p>어느 점포, 어느 층, 어느 시기가 최적인지 근거가 없습니다. 같은 실험을 같은 방식으로 반복합니다.<\/p><\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n<section class=\"ladder\" id=\"solution\">\n  <div class=\"wrap\">\n    <span class=\"eyebrow mute\">Solution Ladder<\/span>\n    <h2 class=\"h2\">리포트에서 끝나지 않습니다.<br>무엇을 바꿀지, 바꿨더니 통했는지까지.<\/h2>\n    <p class=\"lead\">L.GA는 대시보드가 아니라 6단계 솔루션입니다. 측정과 진단은 누구나 할 수 있습니다. 고객 인사이트와 효과 검증은 롯데만 할 수 있습니다.<\/p>\n    <div class=\"steps\">\n      <div class=\"step\"><span class=\"k\">L1<\/span><h3>측정<\/h3><p>통행 · 유입률 · 체류 · 동선 · 집품 · 전환<\/p><span class=\"who\">기존 CCTV + 엣지 AI<\/span><\/div>\n      <div class=\"step\"><span class=\"k\">L2<\/span><h3>진단<\/h3><p>이탈 지점, 카테고리 벤치마크 대비 격차<\/p><span class=\"who\">롯데 전점 벤치마크 DB<\/span><\/div>\n      <div class=\"step only\"><span class=\"k\">L3 ★<\/span><h3>고객 인사이트<\/h3><p>그 고객이 누구이고 무엇을 원하는가. 신규 비율 · 소비 프로파일 · 교차구매<\/p><span class=\"who\">롯데만 가능 — L.POINT<\/span><\/div>\n      <div class=\"step\"><span class=\"k\">L4<\/span><h3>처방<\/h3><p>VMD · 동선 · 가격대 · SKU · 응대 개선안<\/p><span class=\"who\">리테일 컨설턴트<\/span><\/div>\n      <div class=\"step only\"><span class=\"k\">L5 ★<\/span><h3>검증<\/h3><p>개선 전후 POS 실측 비교로 효과를 증명<\/p><span class=\"who\">롯데만 가능 — POS<\/span><\/div>\n      <div class=\"step\"><span class=\"k\">L6<\/span><h3>실행<\/h3><p>안 산 세그먼트에게 L.POINT 앱 쿠폰 · 리타게팅<\/p><span class=\"who\">롯데멤버스 도달 채널<\/span><\/div>\n    <\/div>\n    <p class=\"note\">// 우리는 사람을 추적하지 않습니다. 공간을 측정하고, 세그먼트 단위로만 연결합니다.<\/p>\n  <\/div>\n<\/section>\n\n<section class=\"five\" id=\"insight\">\n  <div class=\"wrap\">\n    <span class=\"eyebrow\">Customer Insight<\/span>\n    <h2 class=\"h2\">브랜드가 아무리 돈을 써도 스스로 알 수 없는 다섯 가지<\/h2>\n    <p class=\"lead\">L.POINT 소비 이력과 롯데 전점 트래픽이 동시에 있어야만 나오는 답입니다. 모든 항목은 개인이 아니라 세그먼트·집계 단위로 제공됩니다.<\/p>\n    <div class=\"list\">\n      <div>\n        <div class=\"item\"><span class=\"q\">Q1<\/span><div><h3>이번에 온 사람 중 신규가 몇 %인가<\/h3><p>이번 팝업이 신규 획득을 했는지, 기존 고객만 다시 온 건지.<\/p><span class=\"no\">브랜드 자체 데이터로는 불가<\/span><\/div><\/div>\n        <div class=\"item\"><span class=\"q\">Q2<\/span><div><h3>들어왔는데 안 산 사람은 누구였나<\/h3><p>가격 미스매치인가, 타깃 오독인가. 미구매자의 소비력과 선호 카테고리.<\/p><span class=\"no\">브랜드 자체 데이터로는 불가<\/span><\/div><\/div>\n        <div class=\"item\"><span class=\"q\">Q3<\/span><div><h3>우리 방문객은 평소 어디서 무엇을 사는가<\/h3><p>\"방문객의 38%가 경쟁 브랜드 구매 이력\" — 포지셔닝과 가격 전략의 근거.<\/p><span class=\"no\">브랜드 자체 데이터로는 불가<\/span><\/div><\/div>\n        <div class=\"item\"><span class=\"q\">Q4<\/span><div><h3>집었는데 안 산 상품은 무엇인가<\/h3><p>온라인 장바구니 이탈의 오프라인 버전. 그대로 상품기획 피드백이 됩니다.<\/p><span class=\"no\">브랜드 자체 데이터로는 불가<\/span><\/div><\/div>\n        <div class=\"item\"><span class=\"q\">Q5<\/span><div><h3>다음 팝업은 어디에, 언제, 어느 층에<\/h3><p>점포 × 층 × 시기별 세그먼트 밀도로 차기 출점을 처방합니다.<\/p><span class=\"no\">브랜드 자체 데이터로는 불가<\/span><\/div><\/div>\n      <\/div>\n      <aside>\n        <span class=\"eyebrow\">One line<\/span>\n        <blockquote>브랜드는 자기가 판 것만 압니다.<br>저희는 놓친 사람이 누구였는지 알려줍니다.<\/blockquote>\n        <p>브랜드는 자기 매장 안만 압니다. 카메라 회사는 자기가 카메라를 단 매장 안만 압니다. 롯데는 그 고객의 하루 전체, 그리고 지난 몇 년의 소비 생애를 압니다. 이 사업은 기술 경쟁이 아니라 자산 경쟁입니다.<\/p>\n        <p><a class=\"btn dark\" href=\"portal/reports/glowlab-jamsil-2026-08.html\" style=\"margin-top:10px\">예시 리포트에서 확인하기 <span class=\"arrow\">→<\/span><\/a><\/p>\n      <\/aside>\n    <\/div>\n  <\/div>\n<\/section>\n\n<section class=\"metrics\" id=\"metrics\">\n  <div class=\"wrap\">\n    <span class=\"eyebrow\">Metrics<\/span>\n    <h2 class=\"h2\">GA를 베끼지 않고, 오프라인 지표로 다시 정의했습니다.<\/h2>\n    <p class=\"lead\">온라인 마케터가 이미 쓰는 언어 그대로 매장을 읽습니다. 지표 체계는 GA와 1:1로 대응합니다.<\/p>\n    <div class=\"table\">\n      <table>\n        <thead><tr><th>온라인 GA<\/th><th>L.GA 오프라인 지표<\/th><th>측정 방법<\/th><\/tr><\/thead>\n        <tbody>\n          <tr><td class=\"ga\">노출 (Impression)<\/td><td class=\"lga\">통행수<\/td><td class=\"how\">매장 앞 통로를 지나간 인원 (익명 좌표 데이터)<\/td><\/tr>\n          <tr><td class=\"ga\">클릭률 (CTR)<\/td><td class=\"lga\">유입률<\/td><td class=\"how\">통행 대비 매장 경계선을 넘은 비율<\/td><\/tr>\n          <tr><td class=\"ga\">체류시간 (Engagement)<\/td><td class=\"lga\">체류 · 동선<\/td><td class=\"how\">구역별 머문 시간, 진입→이탈 경로<\/td><\/tr>\n          <tr><td class=\"ga\">장바구니 (Add to cart)<\/td><td class=\"lga\">집품률<\/td><td class=\"how\">상품을 집어 든 행동 인식 (개인 미식별)<\/td><\/tr>\n          <tr><td class=\"ga\">구매 (Conversion)<\/td><td class=\"lga\">집품→구매 전환율<\/td><td class=\"how\">POS 결제 건수 ÷ 집품 인원<\/td><\/tr>\n          <tr><td class=\"ga\">이탈률 (Bounce)<\/td><td class=\"lga\">3초 이탈률<\/td><td class=\"how\">진입 후 3초 내 되돌아 나간 비율<\/td><\/tr>\n          <tr><td class=\"ga\">신규 vs 재방문 (New vs Returning)<\/td><td class=\"lga\">신규 고객 비중<\/td><td class=\"how\">L.POINT 동의 회원의 브랜드 구매 이력 집계<\/td><\/tr>\n        <\/tbody>\n      <\/table>\n    <\/div>\n  <\/div>\n<\/section>\n\n<section class=\"proof\" id=\"proof\">\n  <div class=\"wrap\">\n    <div>\n      <span class=\"eyebrow\">Proof<\/span>\n      <h2 class=\"h2\">\"이렇게 바꾸세요\"에서 끝나지 않고, 바꿨더니 통했는지 POS로 증명합니다.<\/h2>\n      <p class=\"lead\">효과를 증명하지 못하는 컨설팅은 한 번 팔리고 끝납니다. 증명하는 컨설팅은 갱신됩니다. 결제 데이터가 없는 사업자는 이 단계를 할 수 없습니다.<\/p>\n      <ul>\n        <li><i>1<\/i><div><b>개선안 제시<\/b><span>VMD · 동선 · 가격대 · SKU 구성 · 응대 시나리오 중 우선순위 3가지<\/span><\/div><\/li>\n        <li><i>2<\/i><div><b>2~4주 적용<\/b><span>같은 매장, 같은 시즌 조건에서 적용 전후를 비교<\/span><\/div><\/li>\n        <li><i>3<\/i><div><b>POS 실측 비교<\/b><span>전환율 · 객단가 · 매출 증분을 리포트로 확정. 성과연동 과금의 근거<\/span><\/div><\/li>\n      <\/ul>\n    <\/div>\n    <div class=\"panel\">\n      <span class=\"lbl\">집품 → 구매 전환율 · 처방 적용 전후 (예시)<\/span>\n      <div class=\"ba\">\n        <div class=\"before\"><b>8.1%<\/b><span>적용 전 · 2주<\/span><\/div>\n        <div class=\"delta\">+3.3%p<\/div>\n        <div class=\"after\"><b>11.4%<\/b><span>적용 후 · 2주<\/span><\/div>\n      <\/div>\n      <div class=\"bars\" aria-label=\"전후 비교 막대\">\n        <div class=\"r\"><span>적용 전<\/span><div class=\"t\"><i style=\"width:71%;background:var(--blue-2)\"><\/i><\/div><span class=\"v\">8.1<\/span><\/div>\n        <div class=\"r\"><span>적용 후<\/span><div class=\"t\"><i style=\"width:100%;background:var(--blue)\"><\/i><\/div><span class=\"v\">11.4<\/span><\/div>\n      <\/div>\n      <p class=\"src\">출처: L.GA 파일럿 리포트 예시. 동일 매장 · 동일 요일 구성 기준, 결제 건수는 POS 원장 집계.<\/p>\n    <\/div>\n  <\/div>\n<\/section>\n\n<section class=\"privacy\" id=\"privacy\">\n  <div class=\"wrap\">\n    <span class=\"eyebrow\">Privacy by design<\/span>\n    <h2 class=\"h2\">우리는 사람을 추적하지 않습니다. 공간을 측정합니다.<\/h2>\n    <p class=\"lead\">원본 영상은 카메라 밖으로 나가지 않습니다. 개인 단위 연결은 고객이 직접 동의 버튼을 누른 경우에만 일어나고, 리포트에 개인은 등장하지 않습니다.<\/p>\n    <div class=\"layers\">\n      <div class=\"layer\"><span class=\"k\">LAYER 1 · 공간<\/span><h3>완전 익명<\/h3><p>CCTV 영상은 엣지에서 즉시 좌표와 세그먼트 메타데이터로 변환됩니다. 원본 영상 미전송 · 미저장, 얼굴 특징값 미사용.<\/p><span class=\"pill\">통행 · 유입 · 동선 · 체류 · 집품<\/span><\/div>\n      <div class=\"layer\"><span class=\"k\">LAYER 2 · 고객<\/span><h3>본인 동의 기반<\/h3><p>L.POINT 앱 체크인, QR 이벤트 참여, POS 적립, 멤버십 결제처럼 고객이 스스로 남긴 동의 데이터만 사용합니다.<\/p><span class=\"pill\">신규 비율 · 소비 프로파일 · 쿠폰<\/span><\/div>\n      <div class=\"layer\"><span class=\"k\">연결<\/span><h3>집계 단위로만<\/h3><p>개인 매칭이 아니라 시간대 × 구역 × 세그먼트 단위 집계 매칭입니다. \"20대 후반 뷰티 고관여 세그먼트가 42%\"까지만 말합니다.<\/p><span class=\"pill\">개인정보 영향평가 · DPO 검토<\/span><\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n<section class=\"process\" id=\"process\">\n  <div class=\"wrap\">\n    <span class=\"eyebrow\">How it works<\/span>\n    <h2 class=\"h2\">팝업 계약과 함께 시작해, 종료 7일 안에 리포트 미팅까지.<\/h2>\n    <ol>\n      <li><b>계약 시 번들<\/b><span>팝업 계약 체결 시 백화점 MD가 패키지 제안<\/span><\/li>\n      <li><b>설치 1일<\/b><span>기존 CCTV 연결, 팝업존 보완 카메라 · 엣지박스<\/span><\/li>\n      <li><b>측정<\/b><span>운영 기간 내내 실시간 대시보드<\/span><\/li>\n      <li><b>리포트 미팅<\/b><span>종료 7일 내 전담 컨설턴트가 직접 설명<\/span><\/li>\n      <li><b>처방 적용<\/b><span>VMD · SKU · 동선 개선안 2~4주 적용<\/span><\/li>\n      <li><b>검증 · 실행<\/b><span>POS 전후 비교, 미구매 세그먼트 리타게팅<\/span><\/li>\n    <\/ol>\n  <\/div>\n<\/section>\n\n<section class=\"pricing\" id=\"pricing\">\n  <div class=\"wrap\">\n    <span class=\"eyebrow\">Pricing<\/span>\n    <h2 class=\"h2\">팝업 솔루션 패키지<\/h2>\n    <p class=\"lead\">팝업 1건 기준. 정규 매장 오픈 시 상설 구독으로 이어집니다.<\/p>\n    <div class=\"plans\">\n      <div class=\"plan\">\n        <span class=\"name\">Basic<\/span>\n        <div class=\"price\">180<small>만원 / 건<\/small><\/div>\n        <p class=\"for\">무슨 일이 있었는지 알고 싶은 브랜드<\/p>\n        <ul>\n          <li>통행 · 유입률 · 체류 · 동선 측정<\/li>\n          <li>성별 · 연령대 구성 (익명 추정)<\/li>\n          <li>종료 리포트 (PDF + 포털)<\/li>\n        <\/ul>\n        <a class=\"btn ghost\" href=\"#contact\">문의하기<\/a>\n      <\/div>\n      <div class=\"plan hi\">\n        <span class=\"name\">Standard <span class=\"rec\">가장 많이 선택<\/span><\/span>\n        <div class=\"price\">350<small>만원 / 건<\/small><\/div>\n        <p class=\"for\">그 고객이 누구인지까지 알고 싶은 브랜드<\/p>\n        <ul>\n          <li>Basic 전체 포함<\/li>\n          <li class=\"plus\">카테고리 벤치마크 대비 진단<\/li>\n          <li class=\"plus\">고객 인사이트 — 신규 비율 · 소비 프로파일 · 교차구매<\/li>\n          <li class=\"plus\">미구매자 분석 · 집품 미구매 SKU<\/li>\n          <li class=\"plus\">개선 처방 + 컨설턴트 리포트 미팅<\/li>\n        <\/ul>\n        <a class=\"btn primary\" href=\"#contact\">문의하기<\/a>\n      <\/div>\n      <div class=\"plan\">\n        <span class=\"name\">Premium<\/span>\n        <div class=\"price\">600<small>만원 / 건<\/small><\/div>\n        <p class=\"for\">다음 출점까지 결정하고 싶은 브랜드<\/p>\n        <ul>\n          <li>Standard 전체 포함<\/li>\n          <li class=\"plus\">전관 동선 · 유입 경로 분석<\/li>\n          <li class=\"plus\">처방 적용 후 POS 효과 검증<\/li>\n          <li class=\"plus\">차기 출점 처방 (점포 × 층 × 시기)<\/li>\n          <li class=\"plus\">L.POINT 앱 쿠폰 발송 1회<\/li>\n        <\/ul>\n        <a class=\"btn ghost\" href=\"#contact\">문의하기<\/a>\n      <\/div>\n    <\/div>\n    <div class=\"sub\">\n      <b>상설 매장 구독 · 월 45만원 / 매장<\/b>\n      <span>월간 처방 리포트 + 분기 검증 리포트 + 대시보드<\/span>  function cap(){ return Math.max(7, Math.min(24, Math.round(W / 115))); }\n\n  function proj(x, y){\n    var t = Math.max(0, Math.min(1, y / 60));\n    var persp = 0.44 + 0.78 * t;\n    return { sx: W/2 + (x - 50) * (W/150) * persp, sy: H*0.08 + Math.pow(t, 1.1) * H*0.82, p: persp };\n  }\n\n  var agents = [], pulses = [], tags = [], nextId = 1, spawnIn = 0;\n  var count = {traffic:0, entry:0, pick:0};\n\n  function spawn(){\n    var side = Math.random() < 0.5 ? -1 : 1;\n    agents.push({\n      id: (nextId++ % 99) || 1,\n      x: side < 0 ? XMIN - 4 : XMAX + 4,\n      y: 44 + Math.random()*13,\n      dir: side < 0 ? 1 : -1,\n      speed: 10 + Math.random()*6,\n      state: 'pass', decided: false, counted: false,\n      dwell: 0, picked: false, flash: 0, way: [], trail: [], trailT: 0\n    });\n  }\n  function seat(a){\n    var s = SPOTS[Math.floor(Math.random()*SPOTS.length)];\n    a.way = [{x:50, y:LINE_Y - 1}, {x:s.x + (Math.random()*6-3), y:s.y + (Math.random()*3-1.5)}];\n  }\n\n  function step(a, dt){\n    if(a.state === 'pass'){\n      a.x += a.dir * a.speed * dt;\n      a.y += Math.sin(a.x/14 + a.id) * 1.2 * dt;\n      if(!a.counted && ((a.dir > 0 && a.x > 50) || (a.dir < 0 && a.x < 50))){ a.counted = true; count.traffic++; }\n      if(!a.decided && a.x > GAP0 && a.x < GAP1){\n        a.decided = true;\n        if(Math.random() < 0.45){ a.state = 'enter'; count.entry++; seat(a); pulses.push({x:a.x, t:1}); }\n      }\n    } else if(a.state === 'enter' || a.state === 'leave'){\n      var t = a.way[0];\n      if(!t){\n        if(a.state === 'enter'){ a.state = 'dwell'; a.dwell = 2.6 + Math.random()*3.6; }\n        else { a.state = 'pass'; a.decided = true; a.dir = Math.random() < 0.5 ? 1 : -1; }\n        return;\n      }\n      var dx = t.x - a.x, dy = t.y - a.y, d = Math.hypot(dx, dy);\n      var v = (a.state === 'enter' ? 9 : 11) * dt;\n      if(d < v){ a.x = t.x; a.y = t.y; a.way.shift(); } else { a.x += dx/d * v; a.y += dy/d * v; }\n    } else if(a.state ===  잠실점 팝업 성과 리포트<\/h1>\n      <p class=\"sub\">2F 뷰티관 팝업존 B · 2026년 8월 14일(금) – 8월 27일(목), 14일간. 무슨 일이 있었는지, 그 고객이 누구였는지, 무엇을 바꿔야 했는지, 그리고 바꿨더니 통했는지를 한 권에 담았습니다.<\/p>\n      <div class=\"facts\">\n        <div>운영 기간<b>14일 · 주말 2회 포함<\/b><\/div>\n        <div>측정 방식<b>기존 CCTV 3대 + 보완 카메라 2대<\/b><\/div>\n        <div>고객 데이터<b>L.POINT 동의 회원 3,180명 집계<\/b><\/div>\n        <div>결제 데이터<b>POS 결제 596건 원장 대조<\/b><\/div>\n      <\/div>\n    <\/header>\n\n    <!-- 1 요약 -->\n    <section class=\"sec\" id=\"summary\">\n      <span class=\"k\">01 · Executive summary<\/span>\n      <h2>사람은 잘 들어왔고 잘 집었지만, 잘 사지는 않았습니다. 이유는 가격 사다리였습니다.<\/h2>\n      <p class=\"lead\">유입률과 집품률은 K-뷰티 팝업 벤치마크를 크게 웃돌았습니다. 반면 집품→구매 전환은 1주차 8.1%로 벤치마크(10.6%)에 못 미쳤습니다. 미구매자의 핵심 세그먼트는 평소 뷰티 객단가가 2만원대인 20대 초반 탐색 고객이었고, 팝업 최저가 SKU는 2만 5천원, 주력 앰플은 6만 8천원이었습니다. 8월 20일 중간 미팅에서 가격 사다리와 진열 처방 2건을 즉시 적용했고, 2주차 전환은 11.4%로 올랐습니다.<\/p>\n      <div class=\"body\">\n        <div class=\"tiles\">\n          <div class=\"tile\"><div class=\"l\">통행 (매장 앞)<\/div><div class=\"v\">84,213<small>명<\/small><\/div><div class=\"d\">일평균 6,015명<\/div><\/div>\n          <div class=\"tile\"><div class=\"l\">유입률<\/div><div class=\"v\">21.4<small>%<\/small><\/div><div class=\"d\"><b class=\"up\">+4.2%p<\/b> 벤치마크 17.2%<\/div><\/div>\n          <div class=\"tile\"><div class=\"l\">집품→구매 전환 (전체)<\/div><div class=\"v\">9.7<small>%<\/small><\/div><div class=\"d\"><b class=\"down\">−0.9%p<\/b> 벤치마크 10.6% · 1주차 8.1 → 2주차 11.4<\/div><\/div>\n          <div class=\"tile\"><div class=\"l\">신규 고객 비중<\/div><div class=\"v\">63<small>%<\/small><\/div><div class=\"d\"><b class=\"up\">+12%p<\/b> 벤치마크 51%<\/div><\/div>\n        <\/div>\n        <div class=\"finding\">이번 팝업은 신규 획득 캠페인으로는 성공, 판매 캠페인으로는 절반의 성공입니다.<small>구매자 596명 중 63%가 최근 12개월 롯데 내 글로우랩 구매 이력이 없는 신규였습니다. 다만 들어와서 상품을 집은 6,127명 중 5,531명은 빈손으로 나갔고, 그 대부분이 가격대가 맞지 않는 세그먼트였습니다.<\/small><\/div>\n        <div class=\"tiles\">\n          <div class=\"tile\"><div class=\"l\">POS 매출<\/div><div class=\"v\">2,950<small>만원<\/small><\/div><div class=\"d\">결제 596건 · 건당 49,500원<\/div><\/div>\n          <div class=\"tile\"><div class=\"l\">평균 체류<\/div><div class=\"v\">2:41<\/div><div class=\"d\"><b class=\"up\">+36초<\/b> 벤치마크 2:05<\/div><\/div>\n          <div class=\"tile\"><div class=\"l\">3초 이탈률<\/div><div class=\"v\">28.6<small>%<\/small><\/div><div class=\"d\"><b class=\"up\">−2.4%p<\/b> 벤치마크 31.0% (낮을수록 좋음)<\/div><\/div>\n          <div class=\"tile\"><div class=\"l\">리타게팅 가능 미구매자<\/div><div class=\"v\">4,120<small>명<\/small><\/div><div class=\"d\">L.POINT 동의 회원 · 발송 대기<\/div><\/div>\n        <\/div>\n      <\/div>\n    <\/section>\n\n    <!-- 2 퍼널 -->\n    <section class=\"sec\" id=\"funnel\">\n      <span class=\"k\">02 · Funnel <span class=\"lv\">L1 측정<\/span><span class=\"lv\">L2 진단<\/span><\/span>\n      <h2>방문 퍼널과 벤치마크 대비 진단<\/h2>\n      <p class=\"lead\">온라인 GA의 노출→클릭→장바구니→구매에 대응하는 오프라인 퍼널입니다. 벤치마크는 2026년 상반기 롯데 전점 K-뷰티 팝업 146건의 중앙값입니다.<\/p>\n      <div class=\"body\">\n        <div class=\"two\">\n          <div class=\"fig\">\n            <h3>방문 퍼널 (통행 = 100%)<\/h3>\n            <p class=\"cap\">단계별 인원 · 통행 대비 비율. 막대 위 세로선은 벤치마크 위치<\/p>\n            <div class=\"bars\" style=\"--lw:110px;--vw:118px\">\n              <div class=\"r\"><span class=\"l\">통행<small>IMPRESSION<\/small><\/span><div class=\"t\"><i style=\"width:100%;background:var(--o1)\"><\/i><\/div><span class=\"v\">84,213<small>100%<\/small><\/span><\/div>\n              <div class=\"r\"><span class=\"l\">유입<small>CTR → 유입률<\/small><\/span><div class=\"t\"><i style=\"width:21.4%;background:var(--o2)\"><\/i><i class=\"bm\" style=\"left:17.2%\"><\/i><\/div><span class=\"v\">18,020<small>21.4%<\/small><\/span><\/div>\n              <div class=\"r\"><span class=\"l\">30초+ 체류<small>ENGAGE<\/small><\/span><div class=\"t\"><i style=\"width:11.1%;background:var(--o3)\"><\/i><i class=\"bm\" style=\"left:8.9%\"><\/i><\/div><span class=\"v\">9,370<small>11.1%<\/small><\/span><\/div>\n              <div class=\"r\"><span class=\"l\">집품<small>ADD TO CART<\/small><\/span><div class=\"t\"><i style=\"width:7.3%;background:var(--o4)\"><\/i><i class=\"bm\" style=\"left:5.1%\"><\/i><\/div><span class=\"v\">6,127<small>7.3%<\/small><\/span><\/div>\n              <div class=\"r\"><span class=\"l\">구매<small>CONVERSION<\/small><\/span><div class=\"t\"><i style=\"width:0.7%;background:var(--o5)\"><\/i><i class=\"bm\" style=\"left:0.54%\"><\/i><\/div><span class=\"v\">596<small>0.7%<\/small><\/span><\/div>\n            <\/div>\n            <div class=\"legend\"><span><i style=\"background:var(--o3)\"><\/i>글로우랩 잠실점<\/span><span><i style=\"background:var(--ink);width:2px;height:12px;opacity:.55\"><\/i>K-뷰티 팝업 벤치마크<\/span><\/div>\n          <\/div>\n          <div class=\"fig\" id=\"benchmark\">\n            <h3>단계 전환율 · 벤치마크 대비<\/h3>\n            <p class=\"cap\">각 단계는 직전 단계 대비 비율<\/p>\n            <div class=\"tbl\" style=\"border:0;margin-top:12px\">\n              <table style=\"min-width:0\">\n                <thead><tr><th>지표<\/th><th class=\"n\">잠실점<\/th><th class=\"n\">벤치마크<\/th><th class=\"n\">격차<\/th><\/tr><\/thead>\n                <tbody>\n                  <tr><td>유입률 <span class=\"m\">유입 ÷ 통행<\/span><\/td><td class=\"n\"><b>21.4%<\/b><\/td><td class=\"n\">17.2%<\/td><td class=\"n\"><span class=\"chip good\">+4.2%p<\/span><\/td><\/tr>\n                  <tr><td>3초 이탈률 <span class=\"m\">진입 3초 내 이탈<\/span><\/td><td class=\"n\"><b>28.6%<\/b><\/td><td class=\"n\">31.0%<\/td><td class=\"n\"><span class=\"chip good\">−2.4%p<\/span><\/td><\/tr>\n                  <tr><td>체류 전환 <span class=\"m\">30초+ ÷ 유입<\/span><\/td><td class=\"n\"><b>52.0%<\/b><\/td><td class=\"n\">51.5%<\/td><td class=\"n\"><span class=\"chip info\">+0.5%p<\/span><\/td><\/tr>\n                  <tr><td>집품률 <span class=\"m\">집품 ÷ 유입<\/span><\/td><td class=\"n\"><b>34.0%<\/b><\/td><td class=\"n\">29.5%<\/td><td class=\"n\"><span class=\"chip good\">+4.5%p<\/span><\/td><\/tr>\n                  <tr class=\"hi\"><td>집품→구매 전환 <span class=\"m\">결제 ÷ 집품<\/span><\/td><td class=\"n\"><b>9.7%<\/b><\/td><td class=\"n\">10.6%<\/td><td class=\"n\"><span class=\"chip bad\">−0.9%p<\/span><\/td><\/tr>\n                  <tr><td>구매 전환 <span class=\"m\">결제 ÷ 유입<\/span><\/td><td class=\"n\"><b>3.3%<\/b><\/td><td class=\"n\">3.1%<\/td><td class=\"n\"><span class=\"chip info\">+0.2%p<\/span><\/td><\/tr>\n                <\/tbody>\n              <\/table>\n            <\/div>\n          <\/div>\n        <\/div>\n        <div class=\"finding\">병목은 한 곳, 집품에서 구매로 가는 마지막 단계입니다.<small>유입·체류·집품이 모두 벤치마크를 웃돌았다는 것은 브랜드와 진열이 관심을 끄는 데는 성공했다는 뜻입니다. 집품 후 이탈이 많다는 것은 \"살 마음이 있었는데 사지 않았다\"는 뜻이고, 원인은 §06과 §07에서 가격과 SKU 구성으로 좁혀집니다.<\/small><\/div>\n      <\/div>\n    <\/section>\n\n    <!-- 3 일별 -->\n    <section class=\"sec\" id=\"daily\">\n      <span class=\"k\">03 · Daily <span class=\"lv\">L1 측정<\/span><\/span>\n      <h2>일별 통행과 유입<\/h2>\n      <p class=\"lead\">주말 통행은 평일의 1.8배였고, 유입률은 요일과 무관하게 20~22%로 안정적이었습니다. 8월 21일(금)부터 중간 처방을 적용했습니다.<\/p>\n      <div class=\"body\">\n        <div class=\"fig\">\n          <h3>일별 통행 · 유입 (명)<\/h3>\n          <p class=\"cap\">차트 위에 마우스를 올리면 날짜별 수치를 볼 수 있습니다. 회색 띠는 주말 · 점선은 처방 적용 시점<\/p>\n          <div class=\"chart\" id=\"dailyChart\"><div class=\"tip\" id=\"dailyTip\"><\/div><\/div>\n          <div class=\"legend\"><span><i class=\"line\" style=\"background:var(--s1)\"><\/i>통행<\/span><span><i class=\"line\" style=\"background:var(--s2)\"><\/i>유입<\/span><span><i style=\"background:var(--tint-2)\"><\/i>주말<\/span><\/div>\n        <\/div>\n        <details>\n          <summary style=\"cursor:pointer;font-size:13px;color:var(--slate)\">표로 보기<\/summary>\n          <div class=\"tbl\" style=\"margin-top:10px\"><table id=\"dailyTable\"><thead><tr><th>날짜<\/th><th class=\"n\">통행<\/th><th class=\"n\">유입<\/th><th class=\"n\">유입률<\/th><\/tr><\/thead><tbody><\/tbody><\/table><\/div>\n        <\/details>\n      <\/div>\n    <\/section>\n\n    <!-- 4 구역 -->\n    <section class=\"sec\" id=\"zone\">\n      <span class=\"k\">04 · Zones <span class=\"lv\">L1 측정<\/span><\/span>\n      <h2>구역별 체류와 집품<\/h2>\n      <p class=\"lead\">팝업존을 네 구역으로 나눠 측정했습니다. 세럼·앰플 월(B)과 테스터 바(C)가 체류와 집품을 만들었고, 미니 키트가 놓인 계산대 옆(D)은 거의 보지 않고 지나갔습니다.<\/p>\n      <div class=\"body two\">\n        <div class=\"fig\">\n          <h3>구역별 평균 체류 시간<\/h3>\n          <p class=\"cap\">구역 진입자 기준 · 분:초<\/p>\n          <div class=\"bars\" style=\"--lw:150px;--vw:56px\">\n            <div class=\"r\"><span class=\"l\">B 세럼 · 앰플 월<\/span><div class=\"t\"><i style=\"width:100%\"><\/i><\/div><span class=\"v\">1:12<\/span><\/div>\n            <div class=\"r\"><span class=\"l\">C 테스터 바<\/span><div class=\"t\"><i style=\"width:90%\"><\/i><\/div><span class=\"v\">1:05<\/span><\/div>\n            <div class=\"r\"><span class=\"l\">A 입구 시그니처 테이블<\/span><div class=\"t\"><i style=\"width:53%\"><\/i><\/div><span class=\"v\">0:38<\/span><\/div>\n            <div class=\"r\"><span class=\"l\">D 계산대 · 세트 진열<\/span><div class=\"t\"><i style=\"width:33%\"><\/i><\/div><span class=\"v\">0:24<\/span><\/div>\n          <\/div>\n        <\/div>\n        <div class=\"fig\">\n          <h3>구역별 집품률<\/h3>\n          <p class=\"cap\">구역 진입자 중 상품을 집어 든 비율<\/p>\n          <div class=\"bars\" style=\"--lw:150px;--vw:56px\">\n            <div class=\"r\"><span class=\"l\">B 세럼 · 앰플 월<\/span><div class=\"t\"><i style=\"width:100%\"><\/i><\/div><span class=\"v\">41%<\/span><\/div>\n            <div class=\"r\"><span class=\"l\">C 테스터 바<\/span><div class=\"t\"><i style=\"width:88%\"><\/i><\/div><span class=\"v\">36%<\/span><\/div>\n            <div class=\"r\"><span class=\"l\">A 입구 시그니처 테이블<\/span><div class=\"t\"><i style=\"width:29%\"><\/i><\/div><span class=\"v\">12%<\/span><\/div>\n            <div class=\"r\"><span class=\"l\">D 계산대 · 세트 진열<\/span><div class=\"t\"><i style=\"width:22%\"><\/i><\/div><span class=\"v\">9%<\/span><\/div>\n          <\/div>\n          <p class=\"note\" style=\"margin-top:14px\">C 테스터 바에서 D 계산대로 바로 이동한 비율은 <b>31%<\/b>. 나머지 69%는 테스트 후 B로 돌아갔다가 절반 이상이 빈손으로 나갔습니다.<\/p>\n        <\/div>\n      <\/div>\n    <\/section>\n\n    <!-- 5 인사이트 -->\n    <section class=\"sec\" id=\"insight\">\n      <span class=\"k\">05 · Customer insight <span class=\"only\">L3 · 롯데만 가능<\/span><\/span>\n      <h2>브랜드가 모르는 자기 고객: 이번에 온 사람은 누구였나<\/h2>\n      <p class=\"lead\">L.POINT 동의 회원 3,180명(유입의 17.6%)의 최근 12개월 롯데 내 소비 이력을 세그먼트 단위로 집계했습니다. 개인은 식별되지 않으며, 표본은 유입 전체의 성별·연령 분포에 맞춰 가중했습니다.<\/p>\n      <div class=\"body\">\n        <div class=\"tiles\">\n          <div class=\"tile\"><div class=\"l\">신규 고객 비중<\/div><div class=\"v\">63<small>%<\/small><\/div><div class=\"d\">12개월 내 글로우랩 구매 이력 없음<\/div><\/div>\n          <div class=\"tile\"><div class=\"l\">뷰티 객단가 상위 30% 비중<\/div><div class=\"v\">38<small>%<\/small><\/div><div class=\"d\">롯데 뷰티 구매 회원 기준<\/div><\/div>\n          <div class=\"tile\"><div class=\"l\">1인 가구 추정 비중<\/div><div class=\"v\">54<small>%<\/small><\/div><div class=\"d\">벤치마크 41%<\/div><\/div>\n          <div class=\"tile\"><div class=\"l\">주 거주권<\/div><div class=\"v\">송파 · 강동<\/div><div class=\"d\">47% · 이어서 강남 14%<\/div><\/div>\n        <\/div>\n        <div class=\"two\">\n          <div class=\"fig\">\n            <h3>방문객 세그먼트 구성<\/h3>\n            <p class=\"cap\">연령 × 최근 12개월 소비 패턴으로 군집화<\/p>\n            <div class=\"bars\" style=\"--lw:170px;--vw:50px\">\n              <div class=\"r\"><span class=\"l\">20대 후반 · 뷰티 고관여<small>월 뷰티 지출 상위<\/small><\/span><div class=\"t\"><i style=\"width:100%\"><\/i><\/div><span class=\"v\">42%<\/span><\/div>\n              <div class=\"r\"><span class=\"l\">30대 초반 · 패션 교차구매<small>여성패션 동반 구매<\/small><\/span><div class=\"t\"><i style=\"width:52%\"><\/i><\/div><span class=\"v\">22%<\/span><\/div>\n              <div class=\"r\"><span class=\"l\">20대 초반 · 저관여 탐색<small>뷰티 객단가 2만원대<\/small><\/span><div class=\"t\"><i style=\"width:40%\"><\/i><\/div><span class=\"v\">17%<\/span><\/div>\n              <div class=\"r\"><span class=\"l\">30대 후반+ · 프리미엄 뷰티<small>럭셔리 뷰티 구매 이력<\/small><\/span><div class=\"t\"><i style=\"width:29%\"><\/i><\/div><span class=\"v\">12%<\/span><\/div>\n              <div class=\"r\"><span class=\"l\">기타<\/span><div class=\"t\"><i style=\"width:17%;background:var(--o1)\"><\/i><\/div><span class=\"v\">7%<\/span><\/div>\n            <\/div>\n          <\/div>\n          <div class=\"fig\">\n            <h3>경쟁 브랜드 교차구매<\/h3>\n            <p class=\"cap\">방문객 중 최근 12개월 해당 브랜드군 구매 이력 비율 (복수 해당)<\/p>\n            <div class=\"bars\" style=\"--lw:170px;--vw:50px\">\n              <div class=\"r\"><span class=\"l\">더마 코스메틱 A사<small>앰플 · 세럼 직접 경쟁<\/small><\/span><div class=\"t\"><i style=\"width:100%\"><\/i><\/div><span class=\"v\">38%<\/span><\/div>\n              <div class=\"r\"><span class=\"l\">H&amp;B 스토어 PB<small>1~2만원대<\/small><\/span><div class=\"t\"><i style=\"width:87%\"><\/i><\/div><span class=\"v\">33%<\/span><\/div>\n              <div class=\"r\"><span class=\"l\">클린뷰티 B사<\/span><div class=\"t\"><i style=\"width:71%\"><\/i><\/div><span class=\"v\">27%<\/span><\/div>\n              <div class=\"r\"><span class=\"l\">럭셔리 뷰티 C사<small>10만원대 이상<\/small><\/span><div class=\"t\"><i style=\"width:50%\"><\/i><\/div><span class=\"v\">19%<\/span><\/div>\n            <\/div>\n            <p class=\"note\" style=\"margin-top:14px\">방문객 3명 중 1명이 <b>H&amp;B PB 구매자<\/b>였습니다. 글로우랩의 가격대(2.5~6.8만원)와 이들의 평소 지출 사이에 빈 칸이 있습니다.<\/p>\n          <\/div>\n        <\/div>\n        <div class=\"finding\">글로우랩 잠실점 방문객은 \"더마 A사를 쓰는 20대 후반 송파 1인 가구\"로 요약됩니다.<small>이 세그먼트는 구매 전환도 가장 높았습니다(§06). 브랜드 포지셔닝은 정확히 맞았고, 다음 팝업의 타깃 문구와 입지 선정(§11)은 이 세그먼트를 기준으로 설계했습니다.<\/small><\/div>\n      <\/div>\n    <\/section>\n\n    <!-- 6 미구매자 -->\n    <section class=\"sec\" id=\"nonbuyer\">\n      <span class=\"k\">06 · Non-buyers <span class=\"only\">L3 · 롯데만 가능<\/span><\/span>\n      <h2>들어와서 집었는데 사지 않은 5,531명은 누구였나<\/h2>\n      <p class=\"lead\">구매자와 미구매자의 세그먼트 구성을 비교하면 원인이 보입니다. 타깃을 잘못 잡은 것이 아니라, 들어온 사람 중 한 세그먼트에게 살 수 있는 가격의 상품이 없었습니다.<\/p>\n      <div class=\"body\">\n        <div class=\"fig\">\n          <h3>세그먼트 구성 · 구매자 vs 집품 미구매자<\/h3>\n          <p class=\"cap\">동의 회원 집계 · 각 그룹 내 비율<\/p>\n          <div class=\"bars pair\" style=\"--lw:170px;--vw:60px\">\n            <div class=\"r\"><span class=\"l\">20대 후반 · 뷰티 고관여<\/span><div class=\"t\"><i style=\"width:100%\"><\/i><i class=\"b\" style=\"width:70%\"><\/i><\/div><span class=\"v\"><span>51%<\/span><span>36%<\/span><\/span><\/div>\n            <div class=\"r\"><span class=\"l\">30대 초반 · 패션 교차구매<\/span><div class=\"t\"><i style=\"width:47%\"><\/i><i class=\"b\" style=\"width:41%\"><\/i><\/div><span class=\"v\"><span>24%<\/span><span>21%<\/span><\/span><\/div>\n            <div class=\"r\"><span class=\"l\">20대 초반 · 저관여 탐색<\/span><div class=\"t\"><i style=\"width:18%\"><\/i><i class=\"b\" style=\"width:57%\"><\/i><\/div><span class=\"v\"><span>9%<\/span><span>29%<\/span><\/span><\/div>\n            <div class=\"r\"><span class=\"l\">30대 후반+ · 프리미엄 뷰티<\/span><div class=\"t\"><i style=\"width:22%\"><\/i><i class=\"b\" style=\"width:16%\"><\/i><\/div><span class=\"v\"><span>11%<\/span><span>8%<\/span><\/span><\/div>\n            <div class=\"r\"><span class=\"l\">기타<\/span><div class=\"t\"><i style=\"width:10%\"><\/i><i class=\"b\" style=\"width:12%\"><\/i><\/div><span class=\"v\"><span>5%<\/span><span>6%<\/span><\/span><\/div>\n          <\/div>\n          <div class=\"legend\"><span><i style=\"background:var(--s1)\"><\/i>구매자 (n=596)<\/span><span><i style=\"background:var(--s2)\"><\/i>집품 미구매자 (n=5,531)<\/span><\/div>\n        <\/div>\n        <div class=\"tbl\">\n          <table>\n            <thead><tr><th>세그먼트<\/th><th class=\"n\">미구매자 비중<\/th><th class=\"n\">평소 뷰티 건당 객단가<\/th><th class=\"n\">팝업 최저가 SKU<\/th><th>판단<\/th><\/tr><\/thead>\n            <tbody>\n              <tr class=\"hi\"><td><b>20대 초반 · 저관여 탐색<\/b><span class=\"m\">미구매자 중 과대 대표 (구매자 9% → 미구매자 29%)<\/span><\/td><td class=\"n\">29%<\/td><td class=\"n\">21,400원<\/td><td class=\"n\">25,000원<\/td><td><span class=\"chip bad\">가격 미스매치<\/span><\/td><\/tr>\n              <tr><td><b>20대 후반 · 뷰티 고관여<\/b><span class=\"m\">테스트 후 앰플(68,000원) 내려놓음 비율 높음<\/span><\/td><td class=\"n\">36%<\/td><td class=\"n\">52,800원<\/td><td class=\"n\">25,000원<\/td><td><span class=\"chip warn\">앰플 가격 저항<\/span><\/td><\/tr>\n              <tr><td><b>30대 초반 · 패션 교차구매<\/b><span class=\"m\">C 테스터 바 이용 후 3F 여성패션으로 이동<\/span><\/td><td class=\"n\">21%<\/td><td class=\"n\">44,100원<\/td><td class=\"n\">25,000원<\/td><td><span class=\"chip warn\">동선 · 즉시 픽업 부재<\/span><\/td><\/tr>\n              <tr><td><b>30대 후반+ · 프리미엄 뷰티<\/b><span class=\"m\">구매자 비중과 유사<\/span><\/td><td class=\"n\">8%<\/td><td class=\"n\">98,600원<\/td><td class=\"n\">25,000원<\/td><td><span class=\"chip good\">정상 범위<\/span><\/td><\/tr>\n            <\/tbody>\n          <\/table>\n        <\/div>\n        <div class=\"finding\">가격 미스매치 1건, 앰플 가격 저항 1건, 동선 1건. 타깃 오독은 없습니다.<small>브랜드가 자체 POS만으로 봤다면 \"20대 후반 고관여 고객이 잘 산다\"까지만 알 수 있었습니다. 안 산 사람의 평소 객단가는 L.POINT 소비 이력이 있어야만 보입니다.<\/small><\/div>\n      <\/div>\n    <\/section>\n\n    <!-- 7 SKU -->\n    <section class=\"sec\" id=\"sku\">\n      <span class=\"k\">07 · SKU <span class=\"lv\">L2 진단<\/span><\/span>\n      <h2>집품됐지만 안 팔린 SKU: 오프라인 장바구니 이탈<\/h2>\n      <p class=\"lead\">상품을 집어 든 횟수와 POS 결제를 SKU 단위로 대조했습니다. 온라인의 장바구니 이탈률과 같은 지표이며, 그대로 상품기획 피드백이 됩니다.<\/p>\n      <div class=\"body\">\n        <div class=\"tbl\">\n          <table>\n            <thead><tr><th>SKU<\/th><th class=\"n\">가격<\/th><th class=\"n\">집품<\/th><th class=\"n\">결제<\/th><th class=\"n\">집품→구매<\/th><th>진열<\/th><th>판단<\/th><\/tr><\/thead>\n            <tbody>\n              <tr class=\"hi\"><td><b>리커버리 앰플 50ml<\/b><span class=\"m\">주력 · 테스터 바 시연 상품<\/span><\/td><td class=\"n\">68,000<\/td><td class=\"n\">1,842<\/td><td class=\"n\">118<\/td><td class=\"n\"><b>6.4%<\/b><\/td><td>B · C<\/td><td><span class=\"chip bad\">가격 저항 — 소용량 필요<\/span><\/td><\/tr>\n              <tr><td><b>시그니처 세럼 30ml<\/b><\/td><td class=\"n\">58,000<\/td><td class=\"n\">1,610<\/td><td class=\"n\">248<\/td><td class=\"n\"><b>15.4%<\/b><\/td><td>B<\/td><td><span class=\"chip good\">양호<\/span><\/td><\/tr>\n              <tr><td><b>클렌징 밤 100ml<\/b><\/td><td class=\"n\">32,000<\/td><td class=\"n\">1,204<\/td><td class=\"n\">138<\/td><td class=\"n\"><b>11.5%<\/b><\/td><td>B<\/td><td><span class=\"chip good\">양호<\/span><\/td><\/tr>\n              <tr class=\"hi\"><td><b>미니 키트 3종<\/b><span class=\"m\">진입 상품 역할이어야 하나 D존에 배치<\/span><\/td><td class=\"n\">25,000<\/td><td class=\"n\">894<\/td><td class=\"n\">70<\/td><td class=\"n\"><b>7.8%<\/b><\/td><td>D<\/td><td><span class=\"chip warn\">진열 위치 · 구성<\/span><\/td><\/tr>\n              <tr><td><b>선세럼 40ml<\/b><span class=\"m\">시즌 종료 구간<\/span><\/td><td class=\"n\">42,000<\/td><td class=\"n\">577<\/td><td class=\"n\">22<\/td><td class=\"n\"><b>3.8%<\/b><\/td><td>A<\/td><td><span class=\"chip info\">시즌성 — 제외<\/span><\/td><\/tr>\n              <tr><td><b>합계<\/b><\/td><td class=\"n\">—<\/td><td class=\"n\"><b>6,127<\/b><\/td><td class=\"n\"><b>596<\/b><\/td><td class=\"n\"><b>9.7%<\/b><\/td><td><\/td><td><\/td><\/tr>\n            <\/tbody>\n          <\/table>\n        <\/div>\n        <div class=\"finding\">가장 많이 집었던 상품이 가장 안 팔렸습니다.<small>앰플은 테스터 바에서 가장 많이 시연되고 가장 많이 집혔지만 전환은 6.4%였습니다. \"좋은데 비싸다\"는 신호입니다. 30ml 소용량 또는 세럼 번들이 필요합니다(§09 처방 1).<\/small><\/div>\n      <\/div>\n    <\/section>\n\n    <!-- 8 동선 -->\n    <section class=\"sec\" id=\"path\">\n      <span class=\"k\">08 · Paths <span class=\"lv\">L1 측정<\/span><\/span>\n      <h2>유입 경로와 전후 동선<\/h2>\n      <p class=\"lead\">전관 익명 좌표 데이터로 팝업 진입 직전과 직후의 이동을 집계했습니다. 어디서 왔고 어디로 갔는지는 다음 팝업의 입지와 인접 매장 협업의 근거가 됩니다.<\/p>\n      <div class=\"body two\">\n        <div class=\"fig\">\n          <h3>진입 직전 경로<\/h3>\n          <p class=\"cap\">유입 18,020명 기준<\/p>\n          <div class=\"bars\" style=\"--lw:170px;--vw:50px\">\n            <div class=\"r\"><span class=\"l\">2F 에스컬레이터 직접<\/span><div class=\"t\"><i style=\"width:100%\"><\/i><\/div><span class=\"v\">34%<\/span><\/div>\n            <div class=\"r\"><span class=\"l\">2F K-뷰티 상설매장 경유<\/span><div class=\"t\"><i style=\"width:82%\"><\/i><\/div><span class=\"v\">28%<\/span><\/div>\n            <div class=\"r\"><span class=\"l\">1F 럭셔리 뷰티 경유<\/span><div class=\"t\"><i style=\"width:47%\"><\/i><\/div><span class=\"v\">16%<\/span><\/div>\n            <div class=\"r\"><span class=\"l\">B1 식품관에서 상행<\/span><div class=\"t\"><i style=\"width:35%\"><\/i><\/div><span class=\"v\">12%<\/span><\/div>\n            <div class=\"r\"><span class=\"l\">기타<\/span><div class=\"t\"><i style=\"width:29%;background:var(--o1)\"><\/i><\/div><span class=\"v\">10%<\/span><\/div>\n          <\/div>\n        <\/div>\n        <div class=\"fig\">\n          <h3>이탈 직후 경로<\/h3>\n          <p class=\"cap\">유입 18,020명 기준<\/p>\n          <div class=\"bars\" style=\"--lw:170px;--vw:50px\">\n            <div class=\"r\"><span class=\"l\">2F 뷰티 상설매장<\/span><div class=\"t\"><i style=\"width:100%\"><\/i><\/div><span class=\"v\">41%<\/span><\/div>\n            <div class=\"r\"><span class=\"l\">3F 여성패션<\/span><div class=\"t\"><i style=\"width:54%\"><\/i><\/div><span class=\"v\">22%<\/span><\/div>\n            <div class=\"r\"><span class=\"l\">출구 · 관외 이탈<\/span><div class=\"t\"><i style=\"width:46%\"><\/i><\/div><span class=\"v\">19%<\/span><\/div>\n            <div class=\"r\"><span class=\"l\">B1 식품관<\/span><div class=\"t\"><i style=\"width:27%\"><\/i><\/div><span class=\"v\">11%<\/span><\/div>\n            <div class=\"r\"><span class=\"l\">기타<\/span><div class=\"t\"><i style=\"width:17%;background:var(--o1)\"><\/i><\/div><span class=\"v\">7%<\/span><\/div>\n          <\/div>\n          <p class=\"note\" style=\"margin-top:14px\">팝업을 나온 사람의 <b>41%가 같은 층 뷰티 상설매장<\/b>으로 갔습니다. 그중 더마 A사 매장 진입이 가장 많았습니다. 비교 구매가 일어나고 있다는 뜻입니다.<\/p>\n        <\/div>\n      <\/div>\n    <\/section>\n\n    <!-- 9 처방 -->\n    <section class=\"sec\" id=\"rx\">\n      <span class=\"k\">09 · Prescription <span class=\"lv\">L4 처방<\/span><\/span>\n      <h2>개선 처방 3건<\/h2>\n      <p class=\"lead\">8월 20일 1주차 리포트 미팅에서 제안했고, 1·2번은 8월 21일부터 즉시 적용했습니다. 3번은 팝업 구조상 적용이 어려워 10월 본점 팝업 설계에 반영합니다. 우선순위 순서입니다.<\/p>\n      <div class=\"body\">\n        <div class=\"rx\">\n          <div class=\"it\"><span class=\"no\">1<\/span><div><h3>가격 사다리 보강 — 앰플 30ml 신설, 앰플+세럼 번들<\/h3><p>주력 앰플을 68,000원 단일 용량에서 30ml 44,000원을 추가하고, 앰플+세럼 번들을 98,000원(정가 대비 −22%)으로 구성합니다. 평소 객단가 2만원대 세그먼트에는 미니 키트 가격을 19,000원으로 낮춰 진입 상품 역할을 맡깁니다.<\/p><div class=\"meta\"><span>대상: 20대 초반 탐색 · 20대 후반 고관여<\/span><span>적용 08.21<\/span><span>근거 §06 §07<\/span><\/div><\/div><\/div>\n          <div class=\"it\"><span class=\"no\">2<\/span><div><h3>미니 키트를 D 계산대에서 A 입구 시그니처 테이블로 이동<\/h3><p>진입 상품이 가장 안 보는 구역에 있었습니다. 입구 테이블에 미니 키트를 전면 배치하고, 시즌이 끝난 선세럼은 A에서 뺍니다.<\/p><div class=\"meta\"><span>대상: 전 세그먼트<\/span><span>적용 08.21<\/span><span>근거 §04 §07<\/span><\/div><\/div><\/div>\n          <div class=\"it\"><span class=\"no\">3<\/span><div><h3>테스터 바 옆 즉시 픽업 진열 — C→D 직결 동선<\/h3><p>테스트 후 계산대로 바로 가는 비율이 31%에 그쳤습니다. 테스터 바 바로 옆에 시연 상품의 판매 재고를 두고, 계산대를 C존에 붙입니다. 팝업존 B의 고정 집기 구조상 이번엔 적용하지 못했고 본점 팝업 도면에 반영했습니다.<\/p><div class=\"meta\"><span>대상: 30대 초반 패션 교차구매<\/span><span>본점 10.02 적용 예정<\/span><span>근거 §04 §06<\/span><\/div><\/div><\/div>\n        <\/div>\n      <\/div>\n    <\/section>\n\n    <!-- 10 검증 -->\n    <section class=\"sec\" id=\"verify\">\n      <span class=\"k\">10 · Verification <span class=\"only\">L5 · 롯데만 가능<\/span><\/span>\n      <h2>처방 적용 전후 POS 실측 비교<\/h2>\n      <p class=\"lead\">1주차(08.14–08.20)와 2주차(08.21–08.27)는 각각 금~목 7일로 요일 구성이 같고, 통행량 차이는 0.4%였습니다. 결제 건수는 POS 원장과 대조했으며, 인원 지표는 같은 카메라 · 같은 모델로 측정했습니다.<\/p>\n      <div class=\"body\">\n        <div class=\"two\">\n          <div class=\"fig\">\n            <h3>집품 → 구매 전환율<\/h3>\n            <p class=\"cap\">주차별 · 처방 1·2번 적용<\/p>\n            <div class=\"ba\" style=\"margin-top:16px\">\n              <div class=\"before\"><b>8.1%<\/b><span>1주차 · 적용 전<br>집품 3,090 → 결제 250<\/span><\/div>\n              <div class=\"delta\">+3.3%p<\/div>\n              <div class=\"after\"><b>11.4%<\/b><span>2주차 · 적용 후<br>집품 3,037 → 결제 346<\/span><\/div>\n            <\/div>\n            <div class=\"bars\" style=\"--lw:64px;--vw:44px;margin-top:20px\">\n              <div class=\"r\"><span class=\"l\">적용 전<\/span><div class=\"t\"><i style=\"width:71%;background:var(--o2)\"><\/i><\/div><span class=\"v\">8.1<\/span><\/div>\n              <div class=\"r\"><span class=\"l\">적용 후<\/span><div class=\"t\"><i style=\"width:100%;background:var(--o4)\"><\/i><\/div><span class=\"v\">11.4<\/span><\/div>\n            <\/div>\n          <\/div>\n          <div class=\"fig\">\n            <h3>통제 지표 · 결과 지표<\/h3>\n            <p class=\"cap\">두 주차의 조건이 같았는지, 결과가 달라졌는지<\/p>\n            <div class=\"tbl\" style=\"border:0;margin-top:12px\">\n              <table style=\"min-width:0\">\n                <thead><tr><th>지표<\/th><th class=\"n\">1주차<\/th><th class=\"n\">2주차<\/th><th class=\"n\">변화<\/th><\/tr><\/thead>\n                <tbody>\n                  <tr><td>통행 <span class=\"m\">통제<\/span><\/td><td class=\"n\">42,020<\/td><td class=\"n\">42,193<\/td><td class=\"n\"><span class=\"chip info\">+0.4%<\/span><\/td><\/tr>\n                  <tr><td>유입 <span class=\"m\">통제<\/span><\/td><td class=\"n\">9,030<\/td><td class=\"n\">8,990<\/td><td class=\"n\"><span class=\"chip info\">−0.4%<\/span><\/td><\/tr>\n                  <tr><td>집품 <span class=\"m\">통제<\/span><\/td><td class=\"n\">3,090<\/td><td class=\"n\">3,037<\/td><td class=\"n\"><span class=\"chip info\">−1.7%<\/span><\/td><\/tr>\n                  <tr><td><b>결제 건수<\/b> <span class=\"m\">결과<\/span><\/td><td class=\"n\">250<\/td><td class=\"n\"><b>346<\/b><\/td><td class=\"n\"><span class=\"chip good\">+38.4%<\/span><\/td><\/tr>\n                  <tr><td><b>건당 객단가<\/b> <span class=\"m\">결과 · 번들 효과<\/span><\/td><td class=\"n\">47,200<\/td><td class=\"n\"><b>51,150<\/b><\/td><td class=\"n\"><span class=\"chip good\">+8.4%<\/span><\/td><\/tr>\n                  <tr><td><b>매출<\/b> <span class=\"m\">결과<\/span><\/td><td class=\"n\">1,180만<\/td><td class=\"n\"><b>1,770만<\/b><\/td><td class=\"n\"><span class=\"chip good\">+50.0%<\/span><\/td><\/tr>\n                <\/tbody>\n              <\/table>\n            <\/div>\n          <\/div>\n        <\/div>\n        <div class=\"grid3\">\n          <div class=\"kv\"><div class=\"l\">앰플 계열 전환 (50ml + 30ml)<\/div><div class=\"v\">6.4% → 12.1%<small>+5.7%p<\/small><\/div><\/div>\n          <div class=\"kv\"><div class=\"l\">미니 키트 전환 (D → A 이동 후)<\/div><div class=\"v\">7.8% → 14.6%<small>+6.8%p<\/small><\/div><\/div>\n          <div class=\"kv\"><div class=\"l\">20대 초반 탐색 세그먼트 구매 비중<\/div><div class=\"v\">9% → 17%<small>+8%p<\/small><\/div><\/div>\n        <\/div>\n        <div class=\"finding\">처방이 통했습니다. 조건이 같은 두 주차에서 결제 건수가 38% 늘었고, 늘어난 결제는 처방이 겨냥한 세그먼트와 SKU에서 나왔습니다.<small>이 검증은 성과연동 과금의 근거이자, 10월 본점 팝업의 기본 설계가 됩니다. 처방 3번(동선)은 본점에서 같은 방식으로 검증합니다.<\/small><\/div>\n      <\/div>\n    <\/section>\n\n    <!-- 11 차기 출점 -->\n    <section class=\"sec\" id=\"next\">\n      <span class=\"k\">11 · Next popup <span class=\"only\">L3 · 롯데만 가능<\/span><\/span>\n      <h2>차기 출점 처방: 어디에, 언제, 어느 층에<\/h2>\n      <p class=\"lead\">이번 팝업에서 가장 잘 산 세그먼트(\"20대 후반 뷰티 고관여 · 더마 A사 구매 이력\")가 롯데 전점에서 어느 점포·층·시기에 가장 밀집하는지를 지수화했습니다. 100 = 잠실점 2F 8월 기준.<\/p>\n      <div class=\"body\">\n        <div class=\"tbl\">\n          <table>\n            <thead><tr><th>점포 · 층<\/th><th>추천 시기<\/th><th class=\"n\">핵심 세그먼트 밀도<\/th><th class=\"n\">예상 유입률<\/th><th>비고<\/th><th>추천<\/th><\/tr><\/thead>\n            <tbody>\n              <tr class=\"hi\"><td><b>본점 본관 1F 이벤트홀<\/b><\/td><td>10월 첫째~둘째 주<\/td><td class=\"n\"><b>128<\/b><\/td><td class=\"n\">19~23%<\/td><td>30대 초반 패션 교차구매 세그먼트 밀도 최고 · 처방 3 검증 적합<\/td><td><span class=\"chip good\">1순위 · 계약 완료<\/span><\/td><\/tr>\n              <tr><td><b>롯데월드몰 1F 아트리움<\/b><\/td><td>12월 둘째~셋째 주<\/td><td class=\"n\"><b>121<\/b><\/td><td class=\"n\">24~28%<\/td><td>연말 통행 피크 · 상설매장(구독)과 동선 연계<\/td><td><span class=\"chip good\">2순위<\/span><\/td><\/tr>\n              <tr><td><b>동탄점 2F<\/b><\/td><td>11월<\/td><td class=\"n\"><b>109<\/b><\/td><td class=\"n\">18~21%<\/td><td>30대 초반 1인 가구 밀도 높음 · 더마 A사 매장 없음 (비교 구매 이탈 적음)<\/td><td><span class=\"chip info\">3순위<\/span><\/td><\/tr>\n              <tr><td><b>노원점 1F<\/b><\/td><td>—<\/td><td class=\"n\">84<\/td><td class=\"n\">15~17%<\/td><td>핵심 세그먼트 밀도 낮음 · 40대+ 프리미엄 비중 높음<\/td><td><span class=\"chip bad\">비추천<\/span><\/td><\/tr>\n            <\/tbody>\n          <\/table>\n        <\/div>\n        <div class=\"note\">본점 팝업(10.02–10.15)은 Premium 패키지로 계약되었고, 잠실 처방 1·2번을 기본 설계로, 3번을 검증 항목으로 반영합니다. 미구매자 4,120명(동의 회원)에게는 본점 오픈 일주일 전 L.POINT 앱 쿠폰을 발송해 재방문을 유도합니다(리타게팅 실행 결과는 별도 리포트).<\/div>\n      <\/div>\n    <\/section>\n\n    <!-- 12 방법론 -->\n    <section class=\"sec\" id=\"method\">\n      <span class=\"k\">12 · Data &amp; method<\/span>\n      <h2>데이터와 방법론<\/h2>\n      <div class=\"body\">\n        <div class=\"tbl\">\n          <table>\n            <thead><tr><th>계층<\/th><th>데이터<\/th><th>식별성<\/th><th>이 리포트에서의 용도<\/th><\/tr><\/thead>\n            <tbody>\n              <tr><td><b>Layer 1 · 공간<\/b><\/td><td>기존 CCTV 3대 + 보완 카메라 2대 → 엣지박스에서 좌표·세그먼트 메타데이터로 즉시 변환. 원본 영상 미전송·미저장, 얼굴 특징값 미사용<\/td><td>완전 익명<\/td><td>통행 · 유입 · 체류 · 동선 · 집품 (§02–§04, §08)<\/td><\/tr>\n              <tr><td><b>Layer 2 · 고객<\/b><\/td><td>L.POINT 앱 체크인 · QR 이벤트 · POS 적립 등 본인 동의 회원 3,180명의 최근 12개월 롯데 내 소비 이력<\/td><td>동의 기반 · 집계만 제공<\/td><td>신규 비율 · 세그먼트 · 교차구매 · 미구매자 (§05, §06, §11)<\/td><\/tr>\n              <tr><td><b>POS<\/b><\/td><td>팝업존 B 결제 596건 원장 · SKU 단위<\/td><td>거래 단위 · 개인 미연결<\/td><td>전환율 · SKU 분석 · 효과 검증 (§07, §10)<\/td><\/tr>\n              <tr><td><b>벤치마크<\/b><\/td><td>2026년 상반기 롯데 전점 K-뷰티 팝업 146건 중앙값<\/td><td>집계<\/td><td>진단 기준선 (§02)<\/td><\/tr>\n            <\/tbody>\n          <\/table>\n        <\/div>\n        <p class=\"note\">연결 원칙: 개인 단위 매칭이 아니라 <b>시간대 × 구역 × 세그먼트 단위 집계 매칭<\/b>입니다. 동의 회원 표본은 유입 전체의 성별·연령 추정 분포에 맞춰 가중했으며, 세그먼트 비율의 표본 오차는 ±1.7%p(95%)입니다. 리포트에 개인은 등장하지 않습니다.<\/p>\n      <\/div>\n    <\/section>\n\n    <div class=\"foot\">\n      <span>L.GA Popup Solution Report · GLOWLAB 잠실점 · v2 (검증 포함) · 발행 2026-09-10 · 전담 컨설턴트 서지우<\/span>\n      <span>※ 이 리포트는 L.GA 신사업 제안용 <b>예시<\/b>입니다. 브랜드, 점포 운영 데이터, 수치는 모두 가상의 값이며 실제 롯데 내부 데이터가 아닙니다.<\/span>\n    <\/div>\n  <\/main>\n<\/div>\n\n<script>\n(function(){\n  var days=[\"08.14 금\",\"08.15 토\",\"08.16 일\",\"08.17 월\",\"08.18 화\",\"08.19 수\",\"08.20 목\",\"08.21 금\",\"08.22 토\",\"08.23 일\",\"08.24 월\",\"08.25 화\",\"08.26 수\",\"08.27 목\"];\n  var traffic=[5410,8930,8420,4720,4610,4880,5050,5760,9140,8660,4690,4520,4780,4643];\n  var entries=[1120,1980,1890,990,960,1020,1070,1230,2010,1860,1000,940,1010,940];\n  var weekend=[1,2,8,9], rxDay=7;\n  var W=760,H=280,L=52,R=16,T=18,B=40,pw=W-L-R,ph=H-T-B,ymax=10000;\n  var x=function(i){return L+i*pw/(days.length-1)};\n  var y=function(v){return T+ph-(v/ymax)*ph};\n  var s='<svg viewBox=\"0 0 '+W+' '+H+'\" role=\"img\" aria-label=\"일별 통행과 유입 꺾은선 차트\">';\n  s+='<style>.ax{font:11px \"IBM Plex Mono\",monospace;fill:var(--slate)}.g{stroke:var(--grid);stroke-width:1}<\/style>';\n  // weekend bands\n  var step=pw/(days.length-1);\n  weekend.forEach(function(i){ if(i===1||i===8){ s+='<rect x=\"'+(x(i)-step/2)+'\" y=\"'+T+'\" width=\"'+(step*2)+'\" height=\"'+ph+'\" fill=\"var(--tint-2)\"/>'; } });\n  // grid\n  [0,2500,5000,7500,10000].forEach(function(v){ s+='<line class=\"g\" x1=\"'+L+'\" x2=\"'+(W-R)+'\" y1=\"'+y(v)+'\" y2=\"'+y(v)+'\"/><text class=\"ax\" x=\"'+(L-8)+'\" y=\"'+(y(v)+4)+'\" text-anchor=\"end\">'+v.toLocaleString()+'<\/text>'; });\n  // rx line\n  s+='<line x1=\"'+x(rxDay)+'\" x2=\"'+x(rxDay)+'\" y1=\"'+T+'\" y2=\"'+(T+ph)+'\" stroke=\"var(--red)\" stroke-width=\"1.5\" stroke-dasharray=\"4 4\"/>';\n  s+='<text class=\"ax\" x=\"'+(x(rxDay)-6)+'\" y=\"'+(T+12)+'\" text-anchor=\"end\" style=\"fill:var(--red);font-weight:600\">처방 적용 08.21 ▸<\/text>';\n  // x labels\n  days.forEach(function(d,i){ if(i%2===0||i===13) s+='<text class=\"ax\" x=\"'+x(i)+'\" y=\"'+(H-14)+'\" text-anchor=\"middle\">'+d.slice(0,5)+'<\/text>'; });\n  // lines\n  function path(arr){ return arr.map(function(v,i){return (i?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1)}).join(' '); }\n  s+='<path d=\"'+path(traffic)+' L'+x(13)+' '+y(0)+' L'+x(0)+' '+y(0)+'Z\" fill=\"var(--s1)\" opacity=\".08\"/>';\n  s+='<path d=\"'+path(traffic)+'\" fill=\"none\" stroke=\"var(--s1)\" stroke-width=\"2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>';\n  s+='<path d=\"'+path(entries)+'\" fill=\"none\" stroke=\"var(--s2)\" stroke-width=\"2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>';\n  // end labels\n  s+='<circle cx=\"'+x(13)+'\" cy=\"'+y(traffic[13])+'\" r=\"4.5\" fill=\"var(--s1)\" stroke=\"var(--paper)\" stroke-width=\"2\"/>';\n  s+='<circle cx=\"'+x(13)+'\" cy=\"'+y(entries[13])+'\" r=\"4.5\" fill=\"var(--s2)\" stroke=\"var(--paper)\" stroke-width=\"2\"/>';\n  s+='<text class=\"ax\" x=\"'+(x(8)+8)+'\" y=\"'+(y(traffic[8])-8)+'\" style=\"fill:var(--ink);font-weight:600\">9,140<\/text>';\n  // crosshair + hit\n  s+='<line id=\"xh\" x1=\"0\" x2=\"0\" y1=\"'+T+'\" y2=\"'+(T+ph)+'\" stroke=\"var(--ink)\" stroke-width=\"1\" opacity=\"0\"/>';\n  s+='<circle id=\"d1\" r=\"5\" fill=\"var(--s1)\" stroke=\"var(--paper)\" stroke-width=\"2\" opacity=\"0\"/><circle id=\"d2\" r=\"5\" fill=\"var(--s2)\" stroke=\"var(--paper)\" stroke-width=\"2\" opacity=\"0\"/>';\n  s+='<rect id=\"hit\" x=\"'+L+'\" y=\"'+T+'\" width=\"'+pw+'\" height=\"'+ph+'\" fill=\"transparent\"/>';\n  s+='<\/svg>';\n  var box=document.getElementById('dailyChart'), tip=document.getElementById('dailyTip');\n  box.insertAdjacentHTML('afterbegin',s);\n  var svg=box.querySelector('svg'), hit=svg.querySelector('#hit'), xh=svg.querySelector('#xh'), d1=svg.querySelector('#d1'), d2=svg.querySelector('#d2');\n  function show(e){\n    var r=svg.getBoundingClientRect(); var px=(e.clientX-r.left)*W/r.width;\n    var i=Math.round((px-L)/step); i=Math.max(0,Math.min(days.length-1,i));\n    xh.setAttribute('x1',x(i)); xh.setAttribute('x2',x(i)); xh.setAttribute('opacity','.35');\n    d1.setAttribute('cx',x(i)); d1.setAttribute('cy',y(traffic[i])); d1.setAttribute('opacity','1');\n    d2.setAttribute('cx',x(i)); d2.setAttribute('cy',y(entries[i])); d2.setAttribute('opacity','1');\n    tip.innerHTML='<b>'+days[i]+'<\/b><br>통행 '+traffic[i].toLocaleString()+'<br>유입 '+entries[i].toLocaleString()+' · '+(entries[i]/traffic[i]*100).toFixed(1)+'%';\n    tip.style.left=(x(i)*r.width/W)+'px'; tip.style.top=(y(traffic[i])*r.height/H)+'px'; tip.classList.add('show');\n  }\n  function hide(){ xh.setAttribute('opacity','0'); d1.setAttribute('opacity','0'); d2.setAttribute('opacity','0'); tip.classList.remove('show'); }\n  hit.addEventListener('mousemove',show); hit.addEventListener('touchstart',function(e){show(e.touches[0])},{passive:true}); hit.addEventListener('mouseleave',hide);\n  // table\n  var tb=document.querySelector('#dailyTable tbody');\n  days.forEach(function(d,i){ tb.insertAdjacentHTML('beforeend','<tr><td>'+d+(i===rxDay?' <span class=\"chip info\">처방 적용<\/span>':'')+'<\/td><td class=\"n\">'+traffic[i].toLocaleString()+'<\/td><td class=\"n\">'+entries[i].toLocaleString()+'<\/td><td class=\"n\">'+(entries[i]/traffic[i]*100).toFixed(1)+'%<\/td><\/tr>'); });\n})();\n<\/script>\n<\/body>\n<\/html>\n"}}</script>
<script>
(function(){
  var PAGES = JSON.parse(document.getElementById('pagedata').textContent);
  var BY_PATH = {};
  Object.keys(PAGES).forEach(function(k){ BY_PATH['/' + PAGES[k].base] = k; });
  var view = document.getElementById('view'), boot = document.getElementById('boot');
  var current = null;

  function resolve(href, base){
    try { return new URL(href, 'https://x/' + base).pathname; } catch(e){ return null; }
  }

  function wire(key){
    var doc = view.contentDocument;
    if(!doc) return;
    var base = PAGES[key].base;
    doc.addEventListener('click', function(e){
      var a = e.target.closest && e.target.closest('a[href]');
      if(!a) return;
      var href = a.getAttribute('href');
      if(!href || href.charAt(0) === '#') return;
      var hash = '', i = href.indexOf('#');
      if(i >= 0){ hash = href.slice(i); href = href.slice(0, i); }
      if(/^https?:/i.test(href)) return;
      var target = BY_PATH[resolve(href, base)];
      e.preventDefault();
      if(target) go(target, hash);
    });
    var form = doc.querySelector('form');
    if(key === 'login' && form){
      form.addEventListener('submit', function(e){ e.preventDefault(); go('portal', ''); });
    }
  }

  function go(key, hash){
    if(!PAGES[key]) key = 'home';
    location.hash = key + (hash || '');
    if(current === key + (hash || '')) return;
    current = key + (hash || '');
    view.onload = function(){
      wire(key);
      if(hash){
        var el = view.contentDocument.querySelector(hash);
        if(el) el.scrollIntoView();
      }
      boot.hidden = true;
    };
    view.srcdoc = PAGES[key].html;
  }

  function fromHash(){
    var h = (location.hash || '#home').slice(1);
    var i = h.indexOf('#');
    if(i < 0) return { key: h || 'home', hash: '' };
    return { key: h.slice(0, i), hash: h.slice(i) };
  }

  window.addEventListener('hashchange', function(){
    var s = fromHash();
    if(current !== s.key + s.hash) go(s.key, s.hash);
  });

  var start = fromHash();
  go(start.key, start.hash);
})();
</script>
