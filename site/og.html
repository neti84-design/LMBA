<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>L.GA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root{--red:#E11D2E;--mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
        --sans:"Pretendard Variable",Pretendard,"Noto Sans KR",-apple-system,BlinkMacSystemFont,"Malgun Gothic",sans-serif}
  *{box-sizing:border-box}
  html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#0E1420;color:#fff;font-family:var(--sans)}
  .card{position:relative;width:1200px;height:630px;display:flex;flex-direction:column;justify-content:space-between}
  .top{padding:56px 64px 0}
  .logo{display:inline-flex;align-items:baseline;font-weight:900;font-size:34px;letter-spacing:-0.04em}
  .logo .dot{width:11px;height:11px;background:var(--red);border-radius:50%;display:inline-block;margin-inline:3px}
  .logo small{font-family:var(--mono);font-size:14px;font-weight:500;letter-spacing:.14em;color:#AEB8C7;margin-left:14px}
  h1{margin:30px 0 0;font-size:58px;line-height:1.16;font-weight:900;letter-spacing:-0.035em}
  h1 em{font-style:normal;color:#FF3B4E}
  p{margin:20px 0 0;font-size:21px;color:#C9D0DA;max-width:40ch;line-height:1.55}
  .strip{position:relative;height:250px;background:#080D15;border-top:1px solid #2A3446}
  .strip canvas{display:block;width:1200px;height:250px}
  .strip .veil{position:absolute;inset:0;background:linear-gradient(90deg,rgba(8,13,21,.9),transparent 14%,transparent 86%,rgba(8,13,21,.9))}
  .strip .note{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;
               padding:26px 64px 16px;font-family:var(--mono);font-size:13px;letter-spacing:.05em;color:#97A3B4;
               background:linear-gradient(transparent,rgba(8,13,21,.85) 50%)}
  .strip .note b{color:#E4E8EE;font-weight:500}
</style>
</head>
<body>
<div class="card">
  <div class="top">
    <span class="logo">L<span class="dot"></span>GA <small>LOTTE GROWTH ANALYTICS</small></span>
    <h1>온라인에 GA가 있다면,<br>오프라인 매장에는 <em>L.GA</em>가 있습니다.</h1>
    <p>매장에 들어온 100명 중 브랜드가 아는 고객은 결제한 3명뿐입니다. 나머지 97명의 여정을 데이터로 바꿉니다.</p>
  </div>
  <div class="strip">
    <canvas id="scene"></canvas>
    <div class="veil"></div>
    <p class="note"><span><b>CAM 02</b> · 잠실점 2F 팝업존 B</span><span>엣지 추론 · 원본 영상 미전송 · 얼굴 특징값 미사용</span></p>
  </div>
</div>
<script>
/* 가로 띠 CCTV 장면 — 매장 앞을 지나는 사람과 매장 안 방문객을 익명 박스로 인식합니다.
   실루엣과 번호만 그립니다. 얼굴·개인 식별 개념은 등장하지 않습니다. */
(function(){
  var cv = document.getElementById('scene');
  if(!cv || !cv.getContext) return;
  var ctx = cv.getContext('2d');
  var W = 0, H = 0, DPR = 1;
  var MONO = '"IBM Plex Mono", ui-monospace, Menlo, monospace';
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* 월드 좌표: x 좌우, y 0(매장 안쪽·화면 위) ~ 60(통로 앞·화면 아래) */
  var XMIN = -30, XMAX = 130, LINE_Y = 38, GAP0 = 38, GAP1 = 62;
  var SHELVES = [
    {x0:-22, x1:2,  y0:12, y1:20},
    {x0:16,  x1:40, y0:11, y1:19, label:'세럼 · 앰플 월'},
    {x0:60,  x1:84, y0:11, y1:19, label:'테스터 바'},
    {x0:98,  x1:122,y0:12, y1:20},
    {x0:41,  x1:59, y0:25, y1:31, label:'시그니처 테이블'}
  ];
  var SPOTS = [{x:28,y:22},{x:72,y:22},{x:50,y:34},{x:22,y:21},{x:78,y:21}];
  var C = { pass:'#6DA7EC', inside:'#3987E5', pick:'#F5A623', line:'#F0475A' };

  function resize(){
    var r = cv.getBoundingClientRect();
    if(!r.width || !r.height) return;
    DPR = Math.min(2, window.devicePixelRatio || 1);
    W = r.width; H = r.height;
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  function cap(){ return Math.max(7, Math.min(24, Math.round(W / 115))); }

  function proj(x, y){
    var t = Math.max(0, Math.min(1, y / 60));
    var persp = 0.44 + 0.78 * t;
    return { sx: W/2 + (x - 50) * (W/150) * persp, sy: H*0.08 + Math.pow(t, 1.1) * H*0.82, p: persp };
  }

  var agents = [], pulses = [], tags = [], nextId = 1, spawnIn = 0;
  var count = {traffic:0, entry:0, pick:0};

  function spawn(){
    var side = Math.random() < 0.5 ? -1 : 1;
    agents.push({
      id: (nextId++ % 99) || 1,
      x: side < 0 ? XMIN - 4 : XMAX + 4,
      y: 44 + Math.random()*13,
      dir: side < 0 ? 1 : -1,
      speed: 10 + Math.random()*6,
      state: 'pass', decided: false, counted: false,
      dwell: 0, picked: false, flash: 0, way: [], trail: [], trailT: 0
    });
  }
  function seat(a){
    var s = SPOTS[Math.floor(Math.random()*SPOTS.length)];
    a.way = [{x:50, y:LINE_Y - 1}, {x:s.x + (Math.random()*6-3), y:s.y + (Math.random()*3-1.5)}];
  }

  function step(a, dt){
    if(a.state === 'pass'){
      a.x += a.dir * a.speed * dt;
      a.y += Math.sin(a.x/14 + a.id) * 1.2 * dt;
      if(!a.counted && ((a.dir > 0 && a.x > 50) || (a.dir < 0 && a.x < 50))){ a.counted = true; count.traffic++; }
      if(!a.decided && a.x > GAP0 && a.x < GAP1){
        a.decided = true;
        if(Math.random() < 0.45){ a.state = 'enter'; count.entry++; seat(a); pulses.push({x:a.x, t:1}); }
      }
    } else if(a.state === 'enter' || a.state === 'leave'){
      var t = a.way[0];
      if(!t){
        if(a.state === 'enter'){ a.state = 'dwell'; a.dwell = 2.6 + Math.random()*3.6; }
        else { a.state = 'pass'; a.decided = true; a.dir = Math.random() < 0.5 ? 1 : -1; }
        return;
      }
      var dx = t.x - a.x, dy = t.y - a.y, d = Math.hypot(dx, dy);
      var v = (a.state === 'enter' ? 9 : 11) * dt;
      if(d < v){ a.x = t.x; a.y = t.y; a.way.shift(); } else { a.x += dx/d * v; a.y += dy/d * v; }
    } else if(a.state === 'dwell'){
      a.x += Math.sin(performance.now()/900 + a.id) * 0.9 * dt;
      a.dwell -= dt;
      if(!a.picked && a.dwell < 2.0 && Math.random() < 0.03){ a.picked = true; a.flash = 1.1; count.pick++; }
      if(a.dwell <= 0){ a.state = 'leave'; a.way = [{x:50, y:LINE_Y - 1}, {x:46 + Math.random()*10, y:48 + Math.random()*9}]; }
    }
    if(a.flash > 0) a.flash -= dt;
    a.trailT -= dt;
    if(a.trailT <= 0 && a.y < LINE_Y + 4){
      a.trail.push({x:a.x, y:a.y});
      if(a.trail.length > 16) a.trail.shift();
      a.trailT = 0.16;
    }
    return a.x > XMIN - 12 && a.x < XMAX + 12;
  }

  function label(a){
    if(a.state === 'dwell') return a.picked ? '집품' : '체류';
    if(a.state === 'enter') return '유입';
    if(a.state === 'leave') return '이동';
    return '통행';
  }
  function color(a){
    if(a.flash > 0 || (a.state === 'dwell' && a.picked)) return C.pick;
    return a.state === 'pass' ? C.pass : C.inside;
  }
  function quad(pts, fill){
    ctx.beginPath(); ctx.moveTo(pts[0].sx, pts[0].sy);
    for(var i=1;i<pts.length;i++) ctx.lineTo(pts[i].sx, pts[i].sy);
    ctx.closePath(); ctx.fillStyle = fill; ctx.fill();
  }

  function drawScene(){
    var g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#0B111C'); g.addColorStop(1, '#141E2E');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

    quad([proj(XMIN,0), proj(XMAX,0), proj(XMAX,LINE_Y), proj(XMIN,LINE_Y)], 'rgba(57,135,229,.06)');

    ctx.lineWidth = 1; ctx.strokeStyle = 'rgba(255,255,255,.05)';
    for(var y=0; y<=60; y+=10){
      var a1 = proj(XMIN, y), b1 = proj(XMAX, y);
      ctx.beginPath(); ctx.moveTo(a1.sx, a1.sy); ctx.lineTo(b1.sx, b1.sy); ctx.stroke();
    }
    for(var x=XMIN; x<=XMAX; x+=20){
      var a2 = proj(x, 0), b2 = proj(x, 60);
      ctx.beginPath(); ctx.moveTo(a2.sx, a2.sy); ctx.lineTo(b2.sx, b2.sy); ctx.stroke();
    }

    SHELVES.forEach(function(sh){
      var base = [proj(sh.x0, sh.y0), proj(sh.x1, sh.y0), proj(sh.x1, sh.y1), proj(sh.x0, sh.y1)];
      quad(base, '#1E2A3D');
      var lift = H * 0.115;
      var top = base.map(function(pt){ return {sx:pt.sx, sy:pt.sy - lift * pt.p}; });
      quad(top, '#2A3A52');
      ctx.strokeStyle = 'rgba(148,175,214,.26)'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(top[0].sx, top[0].sy); ctx.lineTo(top[1].sx, top[1].sy);
      ctx.lineTo(top[2].sx, top[2].sy); ctx.lineTo(top[3].sx, top[3].sy); ctx.closePath(); ctx.stroke();
      if(W > 520 && sh.label){
        ctx.font = '10px ' + MONO; ctx.textAlign = 'left'; ctx.fillStyle = 'rgba(174,184,199,.62)';
        ctx.fillText(sh.label, top[0].sx + 2, top[0].sy - 5);
      }
    });

    ctx.save();
    ctx.setLineDash([7, 6]); ctx.lineWidth = 1.6; ctx.strokeStyle = C.line;
    [[XMIN, GAP0], [GAP1, XMAX]].forEach(function(sg){
      var a3 = proj(sg[0], LINE_Y), b3 = proj(sg[1], LINE_Y);
      ctx.beginPath(); ctx.moveTo(a3.sx, a3.sy); ctx.lineTo(b3.sx, b3.sy); ctx.stroke();
    });
    ctx.restore();

    pulses = pulses.filter(function(p){
      var q = proj(p.x, LINE_Y), r = (1 - p.t) * 26 * q.p;
      ctx.beginPath(); ctx.arc(q.sx, q.sy, r, 0, Math.PI*2);
      ctx.strokeStyle = 'rgba(240,71,90,' + (p.t * 0.7).toFixed(3) + ')'; ctx.lineWidth = 2; ctx.stroke();
      p.t -= 0.02; return p.t > 0;
    });

  }

  function drawAgent(a){
    var q = proj(a.x, a.y), col = color(a);
    var bh = H * 0.26 * q.p, bw = bh * 0.34;

    if(a.trail.length > 1){
      ctx.lineWidth = 1.4; ctx.lineCap = 'round';
      for(var i=1;i<a.trail.length;i++){
        var p0 = proj(a.trail[i-1].x, a.trail[i-1].y), p1 = proj(a.trail[i].x, a.trail[i].y);
        ctx.strokeStyle = 'rgba(57,135,229,' + (0.05 + 0.22 * i/a.trail.length).toFixed(3) + ')';
        ctx.beginPath(); ctx.moveTo(p0.sx, p0.sy); ctx.lineTo(p1.sx, p1.sy); ctx.stroke();
      }
    }

    ctx.beginPath(); ctx.ellipse(q.sx, q.sy, bw*0.72, bh*0.075, 0, 0, Math.PI*2);
    ctx.fillStyle = 'rgba(0,0,0,.4)'; ctx.fill();

    var bodyTop = q.sy - bh*0.62;
    ctx.fillStyle = a.state === 'pass' ? '#7B8BA1' : '#A0B5CE';
    ctx.beginPath();
    if(ctx.roundRect) ctx.roundRect(q.sx - bw/2, bodyTop, bw, bh*0.62, bw*0.42);
    else ctx.rect(q.sx - bw/2, bodyTop, bw, bh*0.62);
    ctx.fill();
    ctx.beginPath(); ctx.arc(q.sx, bodyTop - bh*0.15, bh*0.125, 0, Math.PI*2); ctx.fill();

    var x0 = q.sx - bw*0.92, x1 = q.sx + bw*0.92;
    var y0 = bodyTop - bh*0.34, y1 = q.sy + bh*0.05;
    var w = x1 - x0, h2 = y1 - y0, k = Math.min(w, h2) * 0.26;
    ctx.globalAlpha = a.flash > 0 ? 1 : 0.3;
    ctx.strokeStyle = col; ctx.lineWidth = 1; ctx.strokeRect(x0, y0, w, h2);
    ctx.globalAlpha = 1; ctx.lineWidth = 2; ctx.strokeStyle = col;
    ctx.beginPath();
    ctx.moveTo(x0, y0+k); ctx.lineTo(x0, y0); ctx.lineTo(x0+k, y0);
    ctx.moveTo(x1-k, y0); ctx.lineTo(x1, y0); ctx.lineTo(x1, y0+k);
    ctx.moveTo(x1, y1-k); ctx.lineTo(x1, y1); ctx.lineTo(x1-k, y1);
    ctx.moveTo(x0+k, y1); ctx.lineTo(x0, y1); ctx.lineTo(x0, y1-k);
    ctx.stroke();

    if(w > 24) tags.push({x:x0, y:y0 - 16, txt:('0' + a.id).slice(-2) + ' · ' + label(a), col:col});
  }

  function drawTags(){
    var placed = [];
    ctx.font = '10px ' + MONO; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    for(var i = tags.length - 1; i >= 0; i--){
      var t = tags[i], w = ctx.measureText(t.txt).width + 12, h = 14;
      var clash = placed.some(function(r){
        return !(t.x + w < r.x || t.x > r.x + r.w || t.y + h < r.y || t.y > r.y + r.h);
      });
      if(clash) continue;
      placed.push({x:t.x, y:t.y, w:w, h:h});
      ctx.fillStyle = t.col;
      ctx.beginPath();
      if(ctx.roundRect) ctx.roundRect(t.x, t.y, w, h, 3); else ctx.rect(t.x, t.y, w, h);
      ctx.fill();
      ctx.fillStyle = '#0E1420'; ctx.fillText(t.txt, t.x + 6, t.y + 10.5);
    }
    tags.length = 0;
  }

  function render(){ drawScene(); agents.sort(function(a,b){ return a.y - b.y; }); agents.forEach(drawAgent); drawTags(); }

  var last = 0, running = false;
  function frame(now){
    if(!running) return;
    var dt = Math.min(0.05, (now - last)/1000 || 0.016); last = now;
    spawnIn -= dt;
    if(spawnIn <= 0 && agents.length < cap()){ spawn(); spawnIn = 0.35 + Math.random()*0.8; }
    agents = agents.filter(function(a){ return step(a, dt) !== false; });
    render();
    requestAnimationFrame(frame);
  }
  function still(){
    agents.length = 0;
    var n = Math.max(5, Math.min(14, Math.round(W/150)));
    for(var i=0;i<n;i++){
      spawn();
      var a = agents[agents.length-1];
      a.x = XMIN + 8 + i * ((XMAX - XMIN - 16)/Math.max(1,n-1));
      a.y = 45 + (i % 3) * 4;
      a.counted = true; a.decided = true;
    }
    SPOTS.slice(0,3).forEach(function(sp, i){
      spawn();
      var a = agents[agents.length-1];
      a.x = sp.x; a.y = sp.y; a.state = 'dwell'; a.dwell = 3; a.decided = true; a.counted = true; a.picked = (i === 0);
    });
    render();
  }
  function start(){ if(running || reduce) return; running = true; last = performance.now(); requestAnimationFrame(frame); }
  function stop(){ running = false; }

  resize(); still();
  var rt;
  window.addEventListener('resize', function(){
    clearTimeout(rt);
    rt = setTimeout(function(){ resize(); if(!running) still(); }, 160);
  });
  document.addEventListener('visibilitychange', function(){ document.hidden ? stop() : start(); });
  if(!reduce){
    if(window.IntersectionObserver){
      new IntersectionObserver(function(es){ es[0].isIntersecting ? start() : stop(); }, {threshold:0.02}).observe(cv);
    } else start();
  }

  /* 클릭하면 실제 매장 영상 */
  var box = null; var _unused = document.getElementById('lightbox'), clip = document.getElementById('clip'),
      miss = document.getElementById('clipMiss'), closeBtn = document.getElementById('clipClose'),
      playBtn = document.getElementById('playBtn');
  if(!box) return;
  var opener = null;

  function open(e){
    if(e) e.preventDefault();
    opener = document.activeElement;
    box.hidden = false;
    document.body.style.overflow = 'hidden';
    closeBtn.focus();
    var p = clip.play && clip.play();
    if(p && p.catch) p.catch(function(){});
  }
  function close(){
    box.hidden = true;
    document.body.style.overflow = '';
    if(clip.pause) clip.pause();
    if(opener && opener.focus) opener.focus();
  }
  function noFile(){ clip.hidden = true; miss.hidden = false; }

  clip.addEventListener('error', noFile, true);
  var src = clip.querySelector('source');
  if(src) src.addEventListener('error', noFile);

  playBtn.addEventListener('click', open);
  cv.addEventListener('click', open);
  closeBtn.addEventListener('click', close);
  box.addEventListener('click', function(e){ if(e.target === box) close(); });
  document.addEventListener('keydown', function(e){ if(e.key === 'Escape' && !box.hidden) close(); });
})();
</script>
</body>
</html>
